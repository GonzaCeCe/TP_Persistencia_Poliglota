services:
  postgres:
    image: postgres:16
    container_name: tp_postgres
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    container_name: tp_mongo
    command: ["--replSet", "${MONGO_REPLICA_SET}", "--bind_ip_all", "--port", "${MONGO_PORT}"]
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_datos:/data/db
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "${MONGO_PORT}", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: tp_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_datos:/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7.4
    container_name: tp_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  init_postgres:
    image: postgres:16
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command: ["psql", "-h", "postgres", "-U", "${PG_USER}", "-d", "${PG_DB}", "-v", "ON_ERROR_STOP=1", "-q",
              "-f", "/scripts/postgres.sql"]

  init_mongo:
    image: mongo:7.0
    profiles: ["app"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB: ${MONGO_DB}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/iniciar_mongo.sh"]

  init_neo4j:
    image: neo4j:5.26-community
    profiles: ["app"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["cypher-shell", "-a", "bolt://neo4j:7687", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}",
                 "-f", "/scripts/neo4j.cypher"]

  app:
    build: .
    image: tp_app
    profiles: ["app"]
    depends_on:
      init_postgres:
        condition: service_completed_successfully
      init_mongo:
        condition: service_completed_successfully
      init_neo4j:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      MONGO_HOST: mongo
      MONGO_PORT: ${MONGO_PORT}
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: "7687"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LOG_ARCHIVO: salidas/logistica.log
    volumes:
      - ./salidas:/app/salidas
    stdin_open: true
    tty: true

volumes:
  pg_datos:
  mongo_datos:
  neo4j_datos:
  redis_datos:
